name: SmartGO Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartgo_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client & Sync DB Schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/smartgo_test"

      - name: Production Build Check
        run: pnpm build
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/smartgo_test"
          REDIS_URL: "redis://127.0.0.1:6379"

      - name: Start Next.js Server & Verify Endpoints
        run: |
          pnpm start &
          sleep 5
          npx tsx scripts/test-pwa.ts
          npx tsx scripts/benchmark-load-test.ts
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/smartgo_test"
          REDIS_URL: "redis://127.0.0.1:6379"
