services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ellipmart_test
      POSTGRES_USER: ellipmart_test
      POSTGRES_PASSWORD: ellipmart_test_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellipmart_test -d ellipmart_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
