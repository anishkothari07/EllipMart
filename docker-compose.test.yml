services:
  mysql-test:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ellipmart_test
      MYSQL_USER: ellipmart_test
      MYSQL_PASSWORD: ellipmart_test_password
      MYSQL_ROOT_PASSWORD: ellipmart_test_root_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
