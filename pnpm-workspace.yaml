packages:
  - 'apps/*'
  - 'packages/*'

# Moved from package.json pnpm.overrides (ignored in pnpm 10+)
overrides:
  hono: '4.12.25'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
  unrs-resolver: false
