# render.yaml — EllipMart Monorepo deployment config
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Storefront ──────────────────────────────────────────────
  - type: web
    name: ellipmart-storefront
    runtime: docker
    dockerfilePath: ./apps/storefront/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DIRECT_URL
        sync: false

  # ── Merchant Admin ───────────────────────────────────────────
  - type: web
    name: ellipmart-merchant
    runtime: docker
    dockerfilePath: ./apps/merchant/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
